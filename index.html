<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
:root{--bg:#030817;--pan:#0a1530;--bd:#12285a;--ac:#f5842c;--tx:#dbe6ff;--mut:#6b7fa8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px ui-monospace,"JetBrains Mono",Menlo,monospace;max-width:520px;margin:auto}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
input{background:var(--pan);border:1px solid var(--bd);border-radius:6px;padding:10px;outline:0;width:100%}
input:focus{border-color:var(--ac)}
button{background:var(--ac);color:#111;border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}
button.g{background:none;color:var(--tx);padding:6px 10px}
#auth{padding:40px 20px;display:grid;gap:10px}
#auth h2{color:var(--ac)}#err{color:#ff6b6b;min-height:1.2em}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--pan)}
header #title{flex:1;display:grid}header small{color:var(--mut)}
#list{padding:12px;overflow:auto;flex:1}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--pan);margin-top:8px;cursor:pointer}
.item small{color:var(--mut);display:block}
.lbl{color:var(--mut);margin:14px 0 2px;font-size:11px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:flex-end;max-width:85%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:22px;height:22px;border-radius:50%;background:#2563eb;display:grid;place-items:center;font-size:10px;font-style:normal;flex:none}
.bub{background:var(--pan);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:60px;overflow-wrap:anywhere}
.me .bub{background:#0d2759;border-color:#1d4ed8}
.who{color:var(--ac);font-size:11px;font-weight:700}
.bub img{max-width:100%;max-height:260px;border-radius:6px;display:block;margin:4px 0}
.bub time{display:block;text-align:right;color:var(--mut);font-size:10px;margin-top:2px}
.quote{border-left:2px solid var(--ac);background:#00000040;padding:3px 6px;margin:3px 0;font-size:11px;display:grid}
.quote b{color:var(--ac)}.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;color:var(--mut)}
#replybar{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;border-top:1px solid var(--bd);color:var(--mut);background:var(--pan)}
#bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);background:var(--pan);align-items:center}
#emo{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;background:var(--pan);border-top:1px solid var(--bd)}
#emo span{cursor:pointer;font-size:20px}
</style>
</head>
<body>

<div id="auth" hidden>
  <h2>Masuk / Daftar</h2>
  <input id="user" placeholder="Username (khusus daftar)">
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password (min 6 karakter)">
  <p id="err"></p>
  <button id="login">Masuk</button>
  <button id="signup" class="g">Daftar</button>
</div>

<div id="app" hidden>
  <header>
    <button id="back" class="g" hidden>←</button>
    <div id="title"><b>Chat</b></div>
    <button id="out" class="g">Keluar</button>
  </header>

  <section id="list">
    <input id="q" placeholder="Cari orang...">
    <p class="lbl">GRUP</p>
    <div id="rooms"></div>
    <p class="lbl">ORANG</p>
    <div id="users"></div>
  </section>

  <section id="chat" hidden>
    <div id="msgs"></div>
    <div id="replybar" hidden><span id="rtxt"></span><button class="g" id="rx">✕</button></div>
    <div id="emo" hidden></div>
    <div id="bar">
      <button class="g" id="emoBtn">☺</button>
      <input id="txt" placeholder="Tulis pesan..." autocomplete="off">
      <button class="g" id="imgBtn">🖼</button>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="send">➤</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== ISI DENGAN PROJECT SUPABASE KAMU (Settings > API) ======
const SUPABASE_URL = 'https://hzwtaceqtmvhhksezdyg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vKfak5mTb8ehECbfc8K2sA_gSGxsC_Y';
// ================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const hm = d => new Date(d).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

let me, room, chan, replyTo = null;
const msgs = new Map(), names = new Map();

// ---------- auth ----------
const err = t => $('#err').textContent = t || '';
const view = v => { $('#auth').hidden = v !== 'auth'; $('#app').hidden = v === 'auth'; };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return view('auth');
  const { data } = await sb.from('profiles').select('id,username').eq('id', session.user.id).single();
  me = data || { id: session.user.id, username: session.user.email.split('@')[0] };
  names.set(me.id, me.username);
  view('app'); showList();
}
$('#login').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#pass').value });
  error ? err(error.message) : boot();
};
$('#signup').onclick = async () => {
  const username = $('#user').value.trim();
  if (!/^\w{3,20}$/.test(username)) return err('Username 3-20 karakter: huruf, angka, _');
  const { data, error } = await sb.auth.signUp({ email: $('#email').value, password: $('#pass').value, options: { data: { username } } });
  if (error) return err(error.message);
  data.session ? boot() : err('Cek email untuk konfirmasi, lalu masuk.');
};
$('#out').onclick = async () => { await sb.auth.signOut(); leave(); view('auth'); };

// ---------- daftar chat ----------
function showList() {
  leave();
  $('#list').hidden = false; $('#chat').hidden = true; $('#back').hidden = true;
  $('#title').replaceChildren(el('b', '', 'Chat'));
  const r = el('div', 'item');
  r.append(el('i', 'av', '#'), (() => { const d = el('div', '', 'ak admin kau member'); d.append(el('small', '', 'Semua pengguna')); return d; })());
  r.onclick = () => openRoom('global', 'ak admin kau member', 'Semua pengguna');
  $('#rooms').replaceChildren(r);
  loadUsers('');
}
async function loadUsers(q) {
  const { data } = await sb.from('profiles').select('id,username').neq('id', me.id).ilike('username', '%' + q + '%').limit(50);
  $('#users').replaceChildren(...(data || []).map(u => {
    names.set(u.id, u.username);
    const it = el('div', 'item');
    it.append(el('i', 'av', u.username[0].toUpperCase()), el('span', '', u.username));
    it.onclick = () => openRoom([me.id, u.id].sort().join('_'), u.username, 'Pesan pribadi');
    return it;
  }));
}
$('#q').oninput = e => loadUsers(e.target.value.trim());
$('#back').onclick = showList;

// ---------- ruang chat ----------
function leave() { if (chan) { sb.removeChannel(chan); chan = null; } room = null; setReply(null); }

async function fillNames(ids) {
  const miss = [...new Set(ids)].filter(i => !names.has(i));
  if (!miss.length) return;
  const { data } = await sb.from('profiles').select('id,username').in('id', miss);
  (data || []).forEach(u => names.set(u.id, u.username));
}
async function openRoom(id, title, sub) {
  leave(); room = id; msgs.clear(); $('#msgs').replaceChildren();
  $('#list').hidden = true; $('#chat').hidden = false; $('#back').hidden = false;
  $('#title').replaceChildren(el('b', '', title), el('small', '', sub));
  const { data } = await sb.from('messages').select('*').eq('room', id).order('created_at', { ascending: false }).limit(100);
  await fillNames((data || []).map(m => m.user_id));
  (data || []).reverse().forEach(add);
  chan = sb.channel('room-' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + id },
      async p => { await fillNames([p.new.user_id]); add(p.new); })
    .subscribe();
}
function add(m) {
  if (msgs.has(m.id)) return;
  msgs.set(m.id, m);
  const mine = m.user_id === me.id, u = names.get(m.user_id) || '?';
  const row = el('div', 'row' + (mine ? ' me' : ''));
  if (!mine) row.append(el('i', 'av', u[0].toUpperCase()));
  const b = el('div', 'bub');
  if (!mine) b.append(el('div', 'who', u));
  const q = m.reply_to && msgs.get(m.reply_to);
  if (q) { const d = el('div', 'quote'); d.append(el('b', '', names.get(q.user_id) || '?'), el('span', '', q.content || '[gambar]')); b.append(d); }
  if (m.image_url) { const i = el('img'); i.src = m.image_url; i.loading = 'lazy'; i.onload = scroll; b.append(i); }
  if (m.content) b.append(el('div', '', m.content));
  b.append(el('time', '', hm(m.created_at)));
  b.onclick = () => setReply(m);
  row.append(b); $('#msgs').append(row); scroll();
}
const scroll = () => $('#msgs').scrollTop = 1e9;

function setReply(m) {
  replyTo = m;
  $('#replybar').hidden = !m;
  if (m) $('#rtxt').textContent = 'Balas ' + (names.get(m.user_id) || '?') + ': ' + (m.content || '[gambar]').slice(0, 40);
}
$('#rx').onclick = () => setReply(null);

// ---------- kirim ----------
async function send(content, image_url) {
  if (!content && !image_url) return;
  const { data, error } = await sb.from('messages')
    .insert({ room, content: content || null, image_url: image_url || null, reply_to: replyTo ? replyTo.id : null })
    .select().single();
  if (error) return alert(error.message);
  add(data); setReply(null);
}
$('#send').onclick = () => { const t = $('#txt').value.trim(); $('#txt').value = ''; send(t); };
$('#txt').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };

$('#imgBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const path = me.id + '/' + Date.now() + '_' + f.name.replace(/[^\w.]/g, '_');
  const { error } = await sb.storage.from('chat-images').upload(path, f);
  if (error) return alert(error.message);
  send('', sb.storage.from('chat-images').getPublicUrl(path).data.publicUrl);
  e.target.value = '';
};

$('#emo').append(...'😀😂😍😎🥹😭😡👍🙏🔥🎉❤️👀💀✨🤝'.match(/\p{Extended_Pictographic}\uFE0F?/gu).map(x => {
  const s = el('span', '', x); s.onclick = () => { $('#txt').value += x; $('#txt').focus(); }; return s;
}));
$('#emoBtn').onclick = () => $('#emo').hidden = !$('#emo').hidden;

boot();
</script>
</body>
</html>
