<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WireChat</title>
<style>
/* ============================================================
   WireChat — dark redesign
   ============================================================ */
:root{
  --bg:   #0f172a;
  --pan:  #1e293b;
  --pan2: #162032;
  --bd:   #334155;
  --ac:   #7c3aed;
  --ac2:  #6d28d9;
  --tx:   #e2e8f0;
  --mut:  #94a3b8;
  --ok:   #22c55e;
  --err:  #f87171;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--tx);
  font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
  max-width:520px;
  margin:auto;
}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
input{
  background:var(--pan);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:11px 14px;
  outline:0;
  width:100%;
  transition:border-color .15s;
}
input:focus{border-color:var(--ac)}
button{
  background:var(--ac);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,transform .08s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
button:active{transform:scale(.97)}
button.g{
  background:none;
  color:var(--mut);
  border:0;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  transition:color .15s,background .15s;
}
button.g:hover{color:var(--tx);background:rgba(255,255,255,.07)}

/* ── AUTH ── */
#auth{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:32px 20px;
  gap:20px;
}
.auth-brand{text-align:center}
.auth-icon{
  width:64px;height:64px;
  border-radius:20px;
  background:var(--ac);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(124,58,237,.4);
}
.auth-brand h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.auth-brand p{color:var(--mut);font-size:13px;margin-top:4px}
.auth-card{
  background:var(--pan);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:24px;
  display:grid;
  gap:11px;
}
.auth-card h2{font-size:15px;font-weight:600;margin-bottom:2px}
#err{color:var(--err);font-size:12px;min-height:1.2em}
.btn-outline{
  background:transparent!important;
  color:var(--tx)!important;
  border:1px solid var(--bd)!important;
}
.auth-note{text-align:center;color:var(--mut);font-size:12px}

/* ── APP ── */
#app{height:100%;display:flex;flex-direction:column}

/* header */
header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--bd);
  background:var(--pan);
  min-height:56px;
  flex:none;
  position:relative;
  z-index:1;
}
#hd-av{
  width:36px;height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:15px;
  font-weight:700;
  color:#fff;
  flex:none;
  text-transform:uppercase;
  background:var(--ac);
}
#title{flex:1;min-width:0}
#title b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title small{color:var(--mut);font-size:11px;display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ── LIST ── */
#list{display:flex;flex-direction:column;flex:1;overflow:hidden}
.ls-search{
  padding:12px 14px 10px;
  border-bottom:1px solid var(--bd);
  background:var(--pan);
  flex:none;
}
.ls-search input{background:var(--bg);border-color:var(--bd);padding:9px 12px;font-size:13px}
.ls-body{flex:1;overflow-y:auto;padding:8px 8px 12px}
.lbl{
  color:var(--mut);font-size:11px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  padding:10px 8px 4px;
}
.item{
  display:flex;gap:10px;align-items:center;
  padding:8px 10px;border-radius:10px;
  cursor:pointer;transition:background .12s;
  margin-bottom:2px;
}
.item:hover{background:var(--pan)}
.i-av{
  width:42px;height:42px;border-radius:13px;
  display:grid;place-items:center;
  font-size:17px;font-weight:700;
  color:#fff;flex:none;font-style:normal;
  text-transform:uppercase;
}
.i-info{flex:1;min-width:0}
.i-info b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-info small{color:var(--mut);font-size:12px}

/* ── CHAT ── */
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{
  flex:1;overflow-y:auto;
  padding:14px 12px 6px;
  display:flex;flex-direction:column;gap:3px;
}
.row{
  display:flex;gap:8px;align-items:flex-end;
  max-width:88%;
}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{
  width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
  font-style:normal;flex:none;
  color:#fff;text-transform:uppercase;
}
.bub{
  background:var(--pan);
  border:1px solid var(--bd);
  border-radius:14px 14px 14px 4px;
  padding:8px 11px;max-width:100%;
  overflow-wrap:anywhere;cursor:pointer;
  transition:background .1s;
}
.bub:hover{background:#263348}
.me .bub{
  background:var(--ac);
  border-color:var(--ac2);
  border-radius:14px 14px 4px 14px;
}
.me .bub:hover{background:var(--ac2)}
.who{color:var(--ac);font-size:11px;font-weight:700;margin-bottom:2px}
.me .who{display:none}
.bub img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:4px 0}
.bub time{display:block;text-align:right;color:var(--mut);font-size:10px;margin-top:3px}
.me .bub time{color:rgba(255,255,255,.45)}
.quote{
  border-left:2px solid var(--ac);
  background:rgba(0,0,0,.2);
  padding:4px 8px;margin:0 0 6px;
  border-radius:0 4px 4px 0;
  font-size:12px;
}
.quote b{color:var(--ac);display:block;font-size:11px}
.quote span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.me .quote{border-color:rgba(255,255,255,.4)}
.me .quote b{color:rgba(255,255,255,.7)}
.me .quote span{color:rgba(255,255,255,.4)}

/* reply bar */
#replybar{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;
  background:var(--pan);border-top:1px solid var(--bd);
  font-size:12px;color:var(--mut);flex:none;
}
.rp-ico{color:var(--ac);font-style:normal;flex:none}
#rtxt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* emoji */
#emo{
  display:flex;flex-wrap:wrap;gap:2px;
  padding:8px 12px;
  background:var(--pan);border-top:1px solid var(--bd);
  flex:none;
}
#emo span{cursor:pointer;font-size:22px;padding:4px 5px;border-radius:6px;line-height:1;transition:background .1s}
#emo span:hover{background:rgba(255,255,255,.08)}

/* input bar */
#bar{
  display:flex;gap:6px;padding:9px 10px;
  border-top:1px solid var(--bd);background:var(--pan);
  align-items:center;flex:none;
}
#txt{
  flex:1;background:var(--bg);
  border-color:var(--bd);padding:9px 13px;border-radius:10px;
}
#txt:focus{border-color:var(--ac)}
#send{width:38px;height:38px;border-radius:10px;padding:0;flex:none}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<!-- ═══════════════ AUTH ═══════════════ -->
<div id="auth" hidden>
  <div class="auth-brand">
    <div class="auth-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
    </div>
    <h1>WireChat</h1>
    <p>Chat real-time dengan Supabase</p>
  </div>
  <div class="auth-card">
    <h2>Masuk / Daftar</h2>
    <input id="user" placeholder="Username (khusus daftar)">
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password (min 6 karakter)">
    <p id="err"></p>
    <button id="login">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      Masuk
    </button>
    <button id="signup" class="g btn-outline">Daftar Akun Baru</button>
  </div>
  <p class="auth-note">🔒 Aman &amp; terenkripsi</p>
</div>

<!-- ═══════════════ APP ═══════════════ -->
<div id="app" hidden>

  <header>
    <button id="back" class="g" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div id="hd-av" hidden></div>
    <div id="title"><b>WireChat</b></div>
    <button id="out" class="g" title="Keluar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <!-- LIST -->
  <section id="list">
    <div class="ls-search">
      <input id="q" placeholder="Cari orang…">
    </div>
    <div class="ls-body">
      <div class="lbl">Grup</div>
      <div id="rooms"></div>
      <div class="lbl">Pesan Langsung</div>
      <div id="users"></div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chat" hidden>
    <div id="msgs"></div>
    <div id="replybar" hidden>
      <i class="rp-ico">↩</i>
      <span id="rtxt"></span>
      <button class="g" id="rx" style="flex:none;margin-left:4px">✕</button>
    </div>
    <div id="emo" hidden></div>
    <div id="bar">
      <button class="g" id="emoBtn" title="Emoji">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
      </button>
      <input id="txt" placeholder="Tulis pesan…" autocomplete="off">
      <button class="g" id="imgBtn" title="Kirim gambar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="send" title="Kirim">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== ISI DENGAN PROJECT SUPABASE KAMU (Settings > API) ======
const SUPABASE_URL = 'https://hzwtaceqtmvhhksezdyg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vKfak5mTb8ehECbfc8K2sA_gSGxsC_Y';
// ================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const hm = d => new Date(d).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

// Warna avatar berdasarkan huruf pertama username
const AV_COLORS = ['#7c3aed','#1d4ed8','#059669','#dc2626','#d97706','#0891b2','#be185d','#65a30d','#0d9488','#9333ea'];
const avColor = s => AV_COLORS[(s || 'a').charCodeAt(0) % AV_COLORS.length];

let me, room, chan, replyTo = null;
const msgs = new Map(), names = new Map();

// ---------- auth ----------
const err = t => $('#err').textContent = t || '';
const view = v => { $('#auth').hidden = v !== 'auth'; $('#app').hidden = v === 'auth'; };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return view('auth');
  const { data } = await sb.from('profiles').select('id,username').eq('id', session.user.id).single();
  me = data || { id: session.user.id, username: session.user.email.split('@')[0] };
  names.set(me.id, me.username);
  view('app'); showList();
}
$('#login').onclick = async () => {
  err('');
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#pass').value });
  error ? err(error.message) : boot();
};
$('#signup').onclick = async () => {
  err('');
  const username = $('#user').value.trim();
  if (!/^\w{3,20}$/.test(username)) return err('Username 3-20 karakter: huruf, angka, _');
  const { data, error } = await sb.auth.signUp({ email: $('#email').value, password: $('#pass').value, options: { data: { username } } });
  if (error) return err(error.message);
  data.session ? boot() : err('Cek email untuk konfirmasi, lalu masuk.');
};
$('#out').onclick = async () => { await sb.auth.signOut(); leave(); view('auth'); };

// ---------- daftar chat ----------
function showList() {
  leave();
  $('#list').hidden = false; $('#chat').hidden = true; $('#back').hidden = true;
  $('#hd-av').hidden = true;
  $('#title').replaceChildren(el('b', '', 'WireChat'));

  // Global room
  const r = el('div', 'item');
  const rAv = el('i', 'i-av');
  rAv.textContent = '#'; rAv.style.cssText = 'background:#1d4ed8;font-size:20px';
  const rInfo = el('div', 'i-info');
  rInfo.append(el('b', '', 'ak admin kau member'), el('small', '', 'Semua pengguna'));
  r.append(rAv, rInfo);
  r.onclick = () => openRoom('global', 'ak admin kau member', 'Semua pengguna');
  $('#rooms').replaceChildren(r);

  loadUsers('');
}

async function loadUsers(q) {
  const { data } = await sb.from('profiles').select('id,username').neq('id', me.id).ilike('username', '%' + q + '%').limit(50);
  $('#users').replaceChildren(...(data || []).map(u => {
    names.set(u.id, u.username);
    const it = el('div', 'item');
    const av = el('i', 'i-av');
    av.textContent = u.username[0].toUpperCase();
    av.style.background = avColor(u.username);
    const info = el('div', 'i-info');
    info.append(el('b', '', u.username), el('small', '', 'Pesan pribadi'));
    it.append(av, info);
    it.onclick = () => openRoom([me.id, u.id].sort().join('_'), u.username, 'Pesan pribadi');
    return it;
  }));
}
$('#q').oninput = e => loadUsers(e.target.value.trim());
$('#back').onclick = showList;

// ---------- ruang chat ----------
function leave() { if (chan) { sb.removeChannel(chan); chan = null; } room = null; setReply(null); }

async function fillNames(ids) {
  const miss = [...new Set(ids)].filter(i => !names.has(i));
  if (!miss.length) return;
  const { data } = await sb.from('profiles').select('id,username').in('id', miss);
  (data || []).forEach(u => names.set(u.id, u.username));
}

async function openRoom(id, title, sub) {
  leave(); room = id; msgs.clear(); $('#msgs').replaceChildren();
  $('#list').hidden = true; $('#chat').hidden = false; $('#back').hidden = false;

  // Update header
  const hdAv = $('#hd-av');
  hdAv.hidden = false;
  hdAv.textContent = id === 'global' ? '#' : title[0].toUpperCase();
  hdAv.style.background = id === 'global' ? '#1d4ed8' : avColor(title);
  if (id === 'global') hdAv.style.fontSize = '18px';

  const titleEl = el('b', '', title);
  const subEl = el('small', '');
  if (id !== 'global') {
    const dot = el('span', 'dot');
    subEl.append(dot, document.createTextNode(' Online'));
  } else {
    subEl.textContent = sub;
  }
  $('#title').replaceChildren(titleEl, subEl);

  const { data } = await sb.from('messages').select('*').eq('room', id).order('created_at', { ascending: false }).limit(100);
  await fillNames((data || []).map(m => m.user_id));
  (data || []).reverse().forEach(add);

  chan = sb.channel('room-' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + id },
      async p => { await fillNames([p.new.user_id]); add(p.new); })
    .subscribe();
}

function add(m) {
  if (msgs.has(m.id)) return;
  msgs.set(m.id, m);
  const mine = m.user_id === me.id, u = names.get(m.user_id) || '?';

  const row = el('div', 'row' + (mine ? ' me' : ''));

  // Avatar (hanya untuk pesan orang lain)
  if (!mine) {
    const avEl = el('i', 'av');
    avEl.textContent = u[0].toUpperCase();
    avEl.style.background = avColor(u);
    row.append(avEl);
  }

  const b = el('div', 'bub');
  if (!mine) b.append(el('div', 'who', u));

  // Quote/reply
  const q = m.reply_to && msgs.get(m.reply_to);
  if (q) {
    const d = el('div', 'quote');
    d.append(el('b', '', names.get(q.user_id) || '?'), el('span', '', q.content || '[gambar]'));
    b.append(d);
  }

  if (m.image_url) {
    const i = el('img');
    i.src = m.image_url;
    i.loading = 'lazy';
    i.onload = scroll;
    b.append(i);
  }
  if (m.content) b.append(el('div', '', m.content));
  b.append(el('time', '', hm(m.created_at)));
  b.onclick = () => setReply(m);
  row.append(b);

  $('#msgs').append(row);
  scroll();
}

const scroll = () => $('#msgs').scrollTop = 1e9;

function setReply(m) {
  replyTo = m;
  $('#replybar').hidden = !m;
  if (m) $('#rtxt').textContent = 'Balas ' + (names.get(m.user_id) || '?') + ': ' + (m.content || '[gambar]').slice(0, 40);
}
$('#rx').onclick = () => setReply(null);

// ---------- kirim ----------
async function send(content, image_url) {
  if (!content && !image_url) return;
  const { data, error } = await sb.from('messages')
    .insert({ room, content: content || null, image_url: image_url || null, reply_to: replyTo ? replyTo.id : null })
    .select().single();
  if (error) return alert(error.message);
  add(data); setReply(null);
}
$('#send').onclick = () => { const t = $('#txt').value.trim(); $('#txt').value = ''; send(t); };
$('#txt').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };

$('#imgBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const path = me.id + '/' + Date.now() + '_' + f.name.replace(/[^\w.]/g, '_');
  const { error } = await sb.storage.from('chat-images').upload(path, f);
  if (error) return alert(error.message);
  send('', sb.storage.from('chat-images').getPublicUrl(path).data.publicUrl);
  e.target.value = '';
};

// Emoji
$('#emo').append(...'😀😂😍😎🥹😭😡👍🙏🔥🎉❤️👀💀✨🤝'.match(/\p{Extended_Pictographic}\uFE0F?/gu).map(x => {
  const s = el('span', '', x);
  s.onclick = () => { $('#txt').value += x; $('#txt').focus(); };
  return s;
}));
$('#emoBtn').onclick = () => $('#emo').hidden = !$('#emo').hidden;

boot();
</script>
</body>
</html>
